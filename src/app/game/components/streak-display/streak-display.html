<p
  class="streak"
  [class.streak--active]="streak() > 0"
  [class.streak--maximum]="streak() >= maximumDifficultyStreak"
  [class.streak--lost]="lost()"
  [style.--streak-hue]="streakHue()"
  aria-live="polite"
>
  <span>Streak</span>
  <strong class="streak__value" [class.streak__value--updated]="updated()">{{ streak() }}</strong>
</p>

<p class="streak__best">
  <span class="streak__best-description">Best streak: {{ bestStreak() }}</span>
  <span class="streak__best-label" aria-hidden="true">Best</span>
  <strong class="streak__best-value" aria-hidden="true">{{ bestStreak() }}</strong>
</p>
